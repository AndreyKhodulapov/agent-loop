[project]
name = "agent-loop"
version = "0.1.0"
description = "Development loop on top of Claude Code CLI: plan, implement, gate, commit, review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
loop = "agent_loop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
